name: Build SW2 EXT8 VS-only

on:
  workflow_dispatch:
  push:
    branches: [sw2-ext8-build]
    paths:
      - "sw2-ext8/**"
      - ".github/workflows/sw2-ext8-vs-only.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sw2-ext8-build

      - name: Clone SW2
        shell: pwsh
        run: |
          git clone --recursive https://github.com/2016killer/gmod-simple-wound-v2.git sw2
          cd sw2
          git checkout eee9eb9a56d349c2c21452d9a163e6ddaf4b240e
          git submodule update --init --recursive

      - name: Patch EXT8
        shell: pwsh
        run: |
          python sw2-ext8/apply_ext8_patch.py sw2
          python sw2-ext8/fix_nearest_vs.py sw2
          python sw2-ext8/fix_pack4.py sw2
          cd sw2
          git checkout eee9eb9a56d349c2c21452d9a163e6ddaf4b240e -- binary/src/shaders/VertexDeformation.h binary/src/shaders/hlsl/VertexDeformation_vs30.hlsl binary/src/shaders/hlsl/VertexDeformation_ps30.hlsl binary/src/shaders/hlsl/VertexDeformationVertexLit_ps30.hlsl
          cd ..
          python sw2-ext8/verify_vertexlit_only.py sw2

      - name: Prepare shader compiler
        shell: pwsh
        run: |
          git clone https://github.com/ValveSoftware/source-sdk-2013.git source-sdk-2013
          cd source-sdk-2013
          git checkout b8cfb12c0e083a2ef5b2f9f9b50f3902fa034474
          cd ..
          $devbin = Join-Path $PWD "source-sdk-2013/src/devtools/bin"
          $std = Join-Path $PWD "source-sdk-2013/src/materialsystem/stdshaders"
          New-Item -ItemType Directory -Force $devbin | Out-Null
          Invoke-WebRequest "https://github.com/SCell555/ShaderCompile/releases/download/build_235_20231013.2/ShaderCompile.exe" -OutFile (Join-Path $devbin "ShaderCompile.exe")
          Invoke-WebRequest "https://raw.githubusercontent.com/SCell555/ShaderCompile/master/scripts/bin/process_shaders.ps1" -OutFile (Join-Path $devbin "process_shaders.ps1")
          Invoke-WebRequest "https://raw.githubusercontent.com/SCell555/ShaderCompile/master/scripts/stdshaders/buildshaders.bat" -OutFile (Join-Path $std "buildshaders.bat")
          Invoke-WebRequest "https://raw.githubusercontent.com/SCell555/ShaderCompile/master/scripts/headers/cshader.h" -OutFile (Join-Path $PWD "source-sdk-2013/src/public/shaderlib/cshader.h")

      - name: Compile EXT8 vertex shaders
        shell: pwsh
        run: |
          $std = Join-Path $PWD "source-sdk-2013/src/materialsystem/stdshaders"
          $hlsl = Join-Path $PWD "sw2/binary/src/shaders/hlsl"
          $fake = Join-Path $PWD "fakegmod"
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content (Join-Path $fake "gameinfo.txt") '"GameInfo" { game "SW2 EXT8 CI" }' -Encoding ASCII
          $names = @("VertexDeformationVertexLit_vs30.hlsl")
          foreach ($name in $names) { Copy-Item (Join-Path $hlsl $name) (Join-Path $std $name) -Force }
          $names | Set-Content (Join-Path $std "sdkshaders_dx9_30.txt") -Encoding ASCII
          Push-Location $std
          & .\buildshaders.bat sdkshaders_dx9_30 -game $fake -source (Join-Path $PWD "..\..") -force30
          if ($LASTEXITCODE -ne 0) { throw "Shader build failed: $LASTEXITCODE" }
          Pop-Location
          foreach ($name in $names) {
            $stem = [IO.Path]::GetFileNameWithoutExtension($name)
            $incDst = Join-Path $PWD ("sw2/binary/src/shaders/inc/" + $stem + ".inc")
            Copy-Item (Join-Path $std ("include/" + $stem + ".inc")) $incDst -Force
            attrib -R $incDst
            $incText = Get-Content $incDst -Raw
            $incText = [regex]::Replace($incText, '(\w+_Static_Index)\s*\(\s*IShaderShadow\s*\*\s*pShaderShadow\s*,\s*IMaterialVar\s*\*\*\s*params\s*\)', '$1()')
            $incText = [regex]::Replace($incText, '(\w+_Dynamic_Index)\s*\(\s*IShaderDynamicAPI\s*\*\s*pShaderAPI\s*\)', '$1()')
            Set-Content $incDst $incText -Encoding UTF8
            Copy-Item (Join-Path $std ("shaders/fxc/" + $stem + ".vcs")) "$PWD/sw2/binary/src/shaders/vcs/" -Force
          }
          python sw2-ext8/verify_vertexlit_only.py sw2

      - name: Download Premake
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/danielga/garrysmod_common/releases/download/premake-build%2F5.0.0-beta8/premake-5.0.0-beta8-windows.zip" -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath premake -Force

      - name: Generate solution
        shell: pwsh
        run: |
          $premake = (Get-ChildItem "$PWD/premake" -Recurse -Filter premake5.exe | Select-Object -First 1).FullName
          if (!$premake) { throw "premake5.exe not found" }
          cd sw2/binary
          & $premake --file=premake5_x86_x64.lua vs2022
          if ($LASTEXITCODE -ne 0) { throw "Premake failed: $LASTEXITCODE" }

      - name: Build DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          $sln = Get-ChildItem "$PWD/sw2/binary/solution_x86_x64" -Recurse -Filter *.sln | Select-Object -First 1
          if (!$sln) { throw "Generated solution not found" }
          & $msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
          $dll = Get-ChildItem "$PWD/sw2" -Recurse -Filter "gmcl_simple_wound_x86_x64_win64.dll" | Select-Object -First 1
          if (!$dll) { throw "Expected win64 DLL not found" }
          New-Item -ItemType Directory -Force "$PWD/artifact/lua/bin","$PWD/artifact/shaders/fxc" | Out-Null
          Copy-Item $dll.FullName "$PWD/artifact/lua/bin/gmcl_simple_wound_x86_x64_win64.dll"
          Copy-Item "$PWD/sw2/binary/src/shaders/vcs/VertexDeformation*.vcs" "$PWD/artifact/shaders/fxc/"
          Get-FileHash "$PWD/artifact/lua/bin/gmcl_simple_wound_x86_x64_win64.dll" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: SW2-EXT8-VSOnly-win64
          path: artifact/
          if-no-files-found: error
